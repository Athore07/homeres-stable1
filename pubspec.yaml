name: homeres
description: A mobile app connecting homeowners with verified repair technicians.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  cloud_firestore: ^6.3.0
  connectivity_plus: ^7.1.1
  device_info_plus: ^12.4.0
  dio: ^5.9.2
  equatable: ^2.0.8
  firebase_auth: ^6.4.0
  firebase_core: ^4.7.0
  firebase_storage: ^13.3.0
  flutter:
    sdk: flutter
  flutter_animate: ^4.5.2
  flutter_map: ^6.1.0
  flutter_riverpod: ^3.3.1
  flutter_secure_storage: ^10.0.0
  geocoding: ^4.0.0
  geolocator: ^14.0.2
  go_router: ^17.2.2
  google_fonts: ^8.1.0
  latlong2: ^0.9.0
  image_picker: ^1.2.2
  intl: ^0.20.2
  local_auth: ^3.0.1
  package_info_plus: ^9.0.1
  riverpod_annotation: ^4.0.2
  shared_preferences: ^2.5.5
  shimmer: ^3.0.0
  url_launcher: ^6.3.2
  uuid: ^4.5.0
  flutter_osm_plugin: ^1.4.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.0
  riverpod_generator: ^4.0.2

flutter:
  uses-material-design: true
